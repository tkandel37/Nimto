<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon House Party</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#100d1c;color:#fff}.page{min-height:100vh;display:grid;place-items:center;padding:30px;background:radial-gradient(circle at 20% 20%,#7028e455,transparent 35%),radial-gradient(circle at 80% 80%,#00e5c355,transparent 35%),#100d1c}.card{width:min(800px,100%);border:1px solid #ffffff33;border-radius:30px;background:#ffffff0b;padding:60px;text-align:left;box-shadow:0 0 70px #7028e444;backdrop-filter:blur(12px)}.label{color:#00e5c3;font-weight:900;letter-spacing:.24em;text-transform:uppercase}h1{margin:25px 0;font-size:clamp(58px,12vw,110px);line-height:.82;text-transform:uppercase;text-shadow:5px 5px 0 #7028e4}.message{max-width:620px;color:#c9c5d9;font-size:19px;line-height:1.65}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:35px}.details div{border:1px solid #ffffff22;border-radius:16px;padding:18px}.details small{display:block;color:#8f89a4;text-transform:uppercase;font-size:10px;letter-spacing:.16em}.details strong{display:block;margin-top:8px}.guest{margin-top:28px;color:#ff78d1;font-weight:900}@media(max-width:650px){.card{padding:40px 22px}.details{grid-template-columns:1fr}}</style></head><body><main class="page"><section class="card"><div class="label" data-nimto-field="event_label" data-nimto-label="Event Label" data-nimto-type="text">Good people. Good music.</div><h1 data-nimto-field="event_title" data-nimto-label="Event Title" data-nimto-type="text" data-nimto-required="true">House Party</h1><p class="message" data-nimto-field="event_message" data-nimto-label="Event Message" data-nimto-type="textarea" data-nimto-required="true">We are opening the doors, turning up the playlist, and making a night of it. Bring your best energy.</p><div class="details"><div><small>Date</small><strong data-nimto-field="event_date" data-nimto-label="Event Date" data-nimto-type="date" data-nimto-required="true">September 5, 2026</strong></div><div><small>Time</small><strong data-nimto-field="event_time" data-nimto-label="Event Time" data-nimto-type="text" data-nimto-required="true">7:30 PM</strong></div><div><small>Place</small><strong data-nimto-field="venue_name" data-nimto-label="Venue Name" data-nimto-type="text" data-nimto-required="true">The Rooftop House</strong></div></div><div class="guest">On the list: <span data-nimto-field="invitee_name" data-nimto-label="Invitee Name" data-nimto-type="custom_name">you</span></div></section></main></body></html>
