ection class="card"><div class="label" data-nimto-field="event_label" data-nimto-label="Event Label" data-nimto-type="text">Good people. Good music.</div><h1 data-nimto-field="event_title" data-nimto-label="Event Title" data-nimto-type="text" data-nimto-required="true">House Party</h1><p class="message" data-nimto-field="event_message" data-nimto-label="Event Message" data-nimto-type="textarea" data-nimto-required="true">We are opening the doors, turning up the playlist, and making a night of it. Bring your best energy.</p><div class="details"><div><small>Date</small><strong data-nimto-field="event_date" data-nimto-label="Event Date" data-nimto-type="date" data-nimto-required="true">September 5, 2026</strong></div><div><small>Time</small><strong data-nimto-field="event_time" data-nimto-label="Event Time" data-nimto-type="text" data-nimto-required="true">7:30 PM</strong></div><div><small>Place</small><strong data-nimto-field="venue_name" data-nimto-label="Venue Name" data-nimto-type="text" data-nimto-required="true">The Rooftop House</strong></div></div><div class="guest">On the list: <span data-nimto-field="invitee_name" data-nimto-label="Invitee Name" data-nimto-type="custom_name">you</span></div></section><div class="nimto-template-extras"><div class="nimto-countdown-slot" data-nimto-countdown-slot="countdown_main" data-nimto-label="Countdown"></div><div class="nimto-rsvp-slot" data-nimto-rsvp-slot="rsvp_main" data-nimto-label="RSVP"></div><div class="nimto-music-slot" data-nimto-music-slot="music_main" data-nimto-label="Music"></div><div class="nimto-additional-info-slot" data-nimto-additional-info-slot="additional_info_main" data-nimto-label="Additional Information"></div><span class="nimto-style-marker" data-nimto-style-slot="primary_color" data-nimto-style-type="color" data-nimto-label="Primary Color" data-nimto-default="#17251d"></span><span class="nimto-style-marker" data-nimto-style-slot="secondary_color" data-nimto-style-type="color" data-nimto-label="Seco
