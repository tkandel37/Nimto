<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Confetti</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#35234c;background:#fff3d8}.page{min-height:100vh;display:grid;place-items:center;padding:32px;background:radial-gradient(circle at 15% 20%,#ff8eb5 0 6px,transparent 7px),radial-gradient(circle at 85% 28%,#58d6ca 0 7px,transparent 8px),radial-gradient(circle at 70% 80%,#ffca58 0 8px,transparent 9px),#fff3d8;background-size:110px 110px}.card{width:min(760px,100%);border:4px solid #35234c;border-radius:32px;background:#fff;padding:55px;text-align:center;box-shadow:14px 14px 0 #ff8eb5}.label{font-weight:900;letter-spacing:.22em;text-transform:uppercase;color:#e04f88}.age{display:inline-grid;place-items:center;width:110px;height:110px;margin:24px;border-radius:50%;background:#58d6ca;font-size:52px;font-weight:900}h1{margin:8px;font-size:clamp(48px,9vw,88px);line-height:.95}.message{max-width:580px;margin:24px auto;line-height:1.7;color:#725d82}.details{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:28px}.details span{border-radius:999px;background:#f4edf8;padding:12px 18px;font-weight:800}.guest{margin-top:28px;color:#e04f88;font-weight:900}@media(max-width:600px){.card{padding:34px 20px;box-shadow:8px 8px 0 #ff8eb5}}.nimto-template-extras{display:grid;gap:14px;justify-items:center;width:min(100%,560px);margin:30px auto 0}.nimto-countdown-slot,.nimto-rsvp-slot,.nimto-music-slot,.nimto-additional-info-slot{width:100%;text-align:center}.nimto-countdown-slot{font-weight:900}.nimto-rsvp-button{display:inline-flex;align-items:center;justify-content:center;min-width:170px;border-radius:999px;background:currentColor;color:#fff;padding:12px 22px;text-decoration:none}.nimto-music-slot audio{width:min(100%,320px)}.nimto-additional-info-slot{font-size:14px;line-height:1.6}.nimto-style-marker{display:none}</style></head><body data-nimto-share-description-field="event_message" data-nimto-share-title-field="celebrant_name" data-nimto-countdown-position="bottom"><main class="page" data-nimto-print-page="page_main"><section class="card"><div class="label" data-nimto-field="event_label" data-nimto-label="Event Label" data-nimto-type="text">You are invited</div><div class="age" data-nimto-field="age" data-nimto-label="Age" data-nimto-type="number">30</div><h1 data-nimto-field="celebrant_name" data-nimto-label="Celebrant Name" data-nimto-type="text" data-nimto-required="true">Maya's Birthday!</h1><p class="message" data-nimto-field="event_message" data-nimto-label="Event Message" data-nimto-type="textarea" data-nimto-required="true">Come for cake, music, laughter, and a bright evening with our favorite people.</p><div class="details"><span data-nimto-field="event_date" data-nimto-label="Event Date" data-nimto-type="date" data-nimto-required="true">August 22, 2026</span><span data-nimto-field="event_time" data-nimto-label="Event Time" data-nimto-type="text" data-nimto-required="true">5:00 PM</span><span data-nimto-field="venue_name" data-nimto-label="Venue Name" data-nimto-type="text" data-nimto-required="true">Garden Terrace</span></div><div class="guest">For <span data-nimto-field="invitee_name" data-nimto-label="Invitee Name" data-nimto-type="custom_name">our wonderful guest</span></div></section><div class="nimto-template-extras"><div class="nimto-countdown-slot" data-nimto-countdown-slot="countdown_main" data-nimto-label="Countdown"></div><div class="nimto-rsvp-slot" data-nimto-rsvp-slot="rsvp_main" data-nimto-label="RSVP"></div><div class="nimto-music-slot" data-nimto-music-slot="music_main" data-nimto-label="Music"></div><div class="nimto-additional-info-slot" data-nimto-additional-info-slot="additional_info_main" data-nimto-label="Additional Information"></div><span class="nimto-style-marker" data-nimto-style-slot="primary_color" data-nimto-style-type="color" data-nimto-label="Primary Color" data-nimto-default="#17251d"></span><span class="nimto-style-marker" data-nimto-style-slot="secondary_color" data-nimto-style-type="color" data-nimto-label="Secondary Color" data-nimto-default="#6b5a4b"></span><span class="nimto-style-marker" data-nimto-style-slot="accent_color" data-nimto-style-type="color" data-nimto-label="Accent Color" data-nimto-default="#b78431"></span><span class="nimto-style-marker" data-nimto-style-slot="heading_font" data-nimto-style-type="font" data-nimto-label="Heading Font" data-nimto-default="Georgia, serif"></span><span class="nimto-style-marker" data-nimto-style-slot="body_font" data-nimto-style-type="font" data-nimto-label="Body Font" data-nimto-default="Arial, sans-serif"></span></div></main></body></html>
