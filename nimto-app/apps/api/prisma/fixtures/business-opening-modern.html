<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business Opening</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#19201e;background:#ece9e0}.page{min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr}.hero{display:flex;flex-direction:column;justify-content:center;padding:9vw;background:#19201e;color:white}.number{color:#d9ff63;font-size:13px;font-weight:900;letter-spacing:.25em;text-transform:uppercase}h1{margin:28px 0;font-size:clamp(55px,9vw,110px);line-height:.86;letter-spacing:-.06em}.message{max-width:580px;color:#b8c3bf;font-size:18px;line-height:1.7}.details{display:flex;flex-direction:column;justify-content:center;padding:8vw 6vw;background:#d9ff63}.details .label{text-transform:uppercase;letter-spacing:.2em;font-size:11px;font-weight:900}.details h2{margin:20px 0;font-size:42px}.line{margin-top:24px;padding-top:24px;border-top:1px solid #19201e55;font-weight:800}.guest{margin-top:40px;font-size:14px}@media(max-width:700px){.page{grid-template-columns:1fr}.hero,.details{padding:60px 26px}}.nimto-template-extras{display:grid;gap:14px;justify-items:center;width:min(100%,560px);margin:30px auto 0}.nimto-countdown-slot,.nimto-rsvp-slot,.nimto-music-slot,.nimto-additional-info-slot{width:100%;text-align:center}.nimto-countdown-slot{font-weight:900}.nimto-rsvp-button{display:inline-flex;align-items:center;justify-content:center;min-width:170px;border-radius:999px;background:currentColor;color:#fff;padding:12px 22px;text-decoration:none}.nimto-music-slot audio{width:min(100%,320px)}.nimto-additional-info-slot{font-size:14px;line-height:1.6}.nimto-style-marker{display:none}</style></head><body data-nimto-share-description-field="event_message" data-nimto-share-title-field="business_name" data-nimto-countdown-position="bottom"><main class="page" data-nimto-print-page="page_main"><section class="hero"><div class="number" data-nimto-field="event_label" data-nimto-label="Event Label" data-nimto-type="text">Grand opening · You're invited</div><h1 data-nimto-field="business_name" data-nimto-label="Business Name" data-nimto-type="text" data-nimto-required="true">Studio North</h1><p class="message" data-nimto-field="event_message" data-nimto-label="Event Message" data-nimto-type="textarea" data-nimto-required="true">Celebrate a new beginning with an evening of introductions, refreshments, and a first look at our new space.</p></section><section class="details"><div class="label">Opening celebration</div><h2 data-nimto-field="event_date" data-nimto-label="Event Date" data-nimto-type="date" data-nimto-required="true">July 18, 2026</h2><div class="line"><span data-nimto-field="event_time" data-nimto-label="Event Time" data-nimto-type="text" data-nimto-required="true">3:00 PM</span></div><div class="line"><span data-nimto-field="venue_name" data-nimto-label="Venue Name" data-nimto-type="text" data-nimto-required="true">New Road Flagship</span><br><span data-nimto-field="venue_address" data-nimto-label="Venue Address" data-nimto-type="text">Kathmandu</span></div><div class="guest">We look forward to welcoming <strong data-nimto-field="invitee_name" data-nimto-label="Invitee Name" data-nimto-type="custom_name">you</strong>.</div></section><div class="nimto-template-extras"><div class="nimto-countdown-slot" data-nimto-countdown-slot="countdown_main" data-nimto-label="Countdown"></div><div class="nimto-rsvp-slot" data-nimto-rsvp-slot="rsvp_main" data-nimto-label="RSVP"></div><div class="nimto-music-slot" data-nimto-music-slot="music_main" data-nimto-label="Music"></div><div class="nimto-additional-info-slot" data-nimto-additional-info-slot="additional_info_main" data-nimto-label="Additional Information"></div><span class="nimto-style-marker" data-nimto-style-slot="primary_color" data-nimto-style-type="color" data-nimto-label="Primary Color" data-nimto-default="#17251d"></span><span class="nimto-style-marker" data-nimto-style-slot="secondary_color" data-nimto-style-type="color" data-nimto-label="Secondary Color" data-nimto-default="#6b5a4b"></span><span class="nimto-style-marker" data-nimto-style-slot="accent_color" data-nimto-style-type="color" data-nimto-label="Accent Color" data-nimto-default="#b78431"></span><span class="nimto-style-marker" data-nimto-style-slot="heading_font" data-nimto-style-type="font" data-nimto-label="Heading Font" data-nimto-default="Georgia, serif"></span><span class="nimto-style-marker" data-nimto-style-slot="body_font" data-nimto-style-type="font" data-nimto-label="Body Font" data-nimto-default="Arial, sans-serif"></span></div></main></body></html>
