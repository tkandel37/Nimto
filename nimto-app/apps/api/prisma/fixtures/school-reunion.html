<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Reunion</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#e8edf4;color:#172033}.page{min-height:100vh;display:grid;place-items:center;padding:30px;background:linear-gradient(135deg,#eef4ff,#d7e1ef)}.card{width:min(850px,100%);display:grid;grid-template-columns:.8fr 1.2fr;overflow:hidden;border-radius:34px;background:white;box-shadow:0 30px 90px #43516a2b}.left{background:#172033;color:white;padding:54px 34px;display:flex;flex-direction:column;justify-content:space-between}.badge{width:94px;height:94px;border-radius:28px;background:#ffd166;color:#172033;display:grid;place-items:center;font-size:36px;font-weight:900}.label{text-transform:uppercase;letter-spacing:.25em;font-size:12px;font-weight:900;color:#9fb3cc}.right{padding:58px 42px}h1{margin:0 0 10px;font-size:clamp(42px,7vw,76px);line-height:.92;letter-spacing:-.06em}.year{font-size:26px;font-weight:900;color:#2d6cdf}.msg{margin:28px 0;line-height:1.8;color:#5a6675}.details{display:grid;gap:12px}.line{border-radius:16px;background:#f1f5fb;padding:15px;font-weight:900}.guest{margin-top:28px;color:#5a6675}@media(max-width:720px){.card{grid-template-columns:1fr}.left,.right{padding:38px 22px}.left{gap:24px}}</style></head><body><main class="page"><section class="card"><aside class="left"><div><div class="badge">🎓</div><p class="label" data-nimto-field="event_label" data-nimto-label="Event Label" data-nimto-type="text">Old friends, new stories</p></div><p>Reunion night</p></aside><section class="right"><h1 data-nimto-field="school_name" data-nimto-label="School Name" data-nimto-type="text" data-nimto-required="true">Himalayan School</h1><div class="year" data-nimto-field="batch_year" data-nimto-label="Batch Year" data-nimto-type="text">Batch of 2012</div><p class="msg" data-nimto-field="event_message" data-nimto-label="Event Message" data-nimto-type="textarea" data-nimto-required="true">Let us meet again, laugh about old days, and make new memories together.</p><div class="details"><div class="line" data-nimto-field="event_date" data-nimto-label="Event Date" data-nimto-type="date" data-nimto-required="true">June 12, 2027</div><div class="line"><span data-nimto-field="event_time" data-nimto-label="Event Time" data-nimto-type="text" data-nimto-required="true">5:00 PM</span> · <span data-nimto-field="venue_name" data-nimto-label="Venue Name" data-nimto-type="text" data-nimto-required="true">Alumni Hall</span></div></div><p class="guest">We hope to see <strong data-nimto-field="invitee_name" data-nimto-label="Invitee Name" data-nimto-type="custom_name">you</strong>.</p></section></section></main></body></html>
