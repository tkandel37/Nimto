<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashain Tika Blessing</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff4dc;color:#321b12}.page{min-height:100vh;display:grid;place-items:center;padding:32px;background:radial-gradient(circle at 18% 12%,#f8c04d66,transparent 20rem),linear-gradient(145deg,#fff7e5,#f0d0a5)}.card{width:min(760px,100%);border-radius:36px;border:1px solid #a93b2240;background:#fffdf6;padding:56px;box-shadow:0 28px 80px #7a3d1830}.tika{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle,#c82326 0 32%,#f4c04e 33% 58%,#3e8a42 59%);box-shadow:0 0 0 12px #f8d46b33;margin:0 auto 24px}.label{text-align:center;text-transform:uppercase;letter-spacing:.28em;font-size:12px;font-weight:900;color:#a93b22}h1{text-align:center;margin:18px 0;font-size:clamp(44px,8vw,78px);line-height:.95;letter-spacing:-.05em;color:#8e261c}.msg{max-width:560px;margin:28px auto;text-align:center;line-height:1.8;color:#6f4d40}.details{display:grid;gap:14px;margin-top:30px}.line{border-radius:18px;background:#fff3d5;padding:16px 18px;font-weight:900}.guest{text-align:center;margin-top:30px;color:#6f4d40}@media(max-width:620px){.card{padding:42px 22px}}</style></head><body><main class="page"><section class="card"><div class="tika"></div><p class="label" data-nimto-field="event_label" data-nimto-label="Event Label" data-nimto-type="text">Dashain tika invitation</p><h1 data-nimto-field="family_name" data-nimto-label="Family Name" data-nimto-type="text" data-nimto-required="true">Kandel Family</h1><p class="msg" data-nimto-field="event_message" data-nimto-label="Event Message" data-nimto-type="textarea" data-nimto-required="true">Please join us for tika, jamara, blessings, family photos, and a warm Dashain meal together.</p><div class="details"><div class="line" data-nimto-field="event_date" data-nimto-label="Event Date" data-nimto-type="date" data-nimto-required="true">October 20, 2026</div><div class="line"><span data-nimto-field="event_time" data-nimto-label="Event Time" data-nimto-type="text" data-nimto-required="true">10:30 AM</span> · <span data-nimto-field="venue_name" data-nimto-label="Venue Name" data-nimto-type="text" data-nimto-required="true">Family Home, Lalitpur</span></div></div><p class="guest">With love for <strong data-nimto-field="invitee_name" data-nimto-label="Invitee Name" data-nimto-type="custom_name">you</strong>.</p></section></main></body></html>
