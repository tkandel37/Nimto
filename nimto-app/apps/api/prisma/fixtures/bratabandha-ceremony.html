<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bratabandha Ceremony</title><style>*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:#efe3cc;color:#2d2118}.page{min-height:100vh;display:grid;place-items:center;padding:34px;background:linear-gradient(135deg,#f8eedc,#d9bf96)}.card{width:min(790px,100%);background:#fffaf0;border:1px solid #8a673a55;border-radius:30px;padding:64px 42px;text-align:center;box-shadow:0 26px 80px #5b3a1730}.symbol{font-size:48px;color:#a66a28}.label{font:900 12px Arial;letter-spacing:.28em;text-transform:uppercase;color:#8a673a}h1{margin:24px 0 8px;font-size:clamp(46px,8vw,82px);line-height:.95;letter-spacing:-.04em;color:#6b3517}.family{font-weight:900;color:#8a673a}.msg{max-width:570px;margin:28px auto;line-height:1.8;color:#6d5a4b}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}.box{border-radius:18px;background:#f3e3c9;padding:16px;font:900 14px Arial}.guest{margin-top:30px;color:#6d5a4b}@media(max-width:620px){.card{padding:48px 22px}.details{grid-template-columns:1fr}}:root{--nimto-primary-color:#17251d;--nimto-secondary-color:#6b5a4b;--nimto-accent-color:#b78431;--nimto-heading-font:Georgia,serif;--nimto-body-font:Arial,sans-serif}body{font-family:var(--nimto-body-font,inherit)}h1,h2,h3,.names,.number,.year,.date,[data-nimto-field="event_title"],[data-nimto-field="business_name"],[data-nimto-field="school_name"],[data-nimto-field="couple_name"],[data-nimto-field="bride_name"],[data-nimto-field="groom_name"],[data-nimto-field="family_name"],[data-nimto-field="baby_name"],[data-nimto-field="child_name"],[data-nimto-field="celebrant_name"]{font-family:var(--nimto-heading-font,inherit);color:var(--nimto-primary-color,currentColor)}.label,.top,.number,.year,.date,.amp,[data-nimto-field="event_label"],[data-nimto-field="event_date"],[data-nimto-field="event_time"],[data-nimto-field="venue_name"]{color:var(--nimto-accent-color,currentColor)}.message,.msg,.guest,.venue,.details,.line,.pill,.box,[data-nimto-field="event_message"],[data-nimto-field="venue_address"]{color:var(--nimto-secondary-color,currentColor)}.nimto-template-extras{display:grid;gap:14px;justify-items:center;width:min(100%,560px);margin:30px auto 0}.nimto-countdown-slot,.nimto-rsvp-slot,.nimto-music-slot,.nimto-additional-info-slot{width:100%;text-align:center}.nimto-countdown-slot{font-weight:900}.nimto-rsvp-button{display:inline-flex;align-items:center;justify-content:center;min-width:170px;border-radius:999px;background:var(--nimto-primary-color,#17251d);color:#fff;padding:12px 22px;text-decoration:none}.nimto-music-slot audio{width:min(100%,320px)}.nimto-additional-info-slot{font-size:14px;line-height:1.6}.nimto-style-marker{display:none}</style></head><body data-nimto-share-description-field="event_message" data-nimto-share-title-field="child_name" data-nimto-countdown-position="bottom"><main class="page" data-nimto-print-page="page_main"><section class="card"><div class="symbol">ॐ</div><p class="label" data-nimto-field="event_label" data-nimto-label="Event Label" data-nimto-type="text">Sacred ceremony</p><h1 data-nimto-field="child_name" data-nimto-label="Child Name" data-nimto-type="text" data-nimto-required="true">Aayush</h1><p class="family">Hosted by <span data-nimto-field="family_name" data-nimto-label="Family Name" data-nimto-type="text" data-nimto-required="true">Shrestha Family</span></p><p class="msg" data-nimto-field="event_message" data-nimto-label="Event Message" data-nimto-type="textarea" data-nimto-required="true">We invite you to bless our son as he receives his sacred thread in the presence of family and elders.</p><div class="details"><div class="box" data-nimto-field="event_date" data-nimto-label="Event Date" data-nimto-type="date" data-nimto-required="true">Baisakh 12, 2083</div><div class="box" data-nimto-field="event_time" data-nimto-label="Event Time" data-nimto-type="text" data-nimto-required="true">8:00 AM</div><div class="box" data-nimto-field="venue_name" data-nimto-label="Venue Name" data-nimto-type="text" data-nimto-required="true">Family Temple Hall</div><div class="box">Blessings & Bhoj</div></div><p class="guest">Respectfully inviting <strong data-nimto-field="invitee_name" data-nimto-label="Invitee Name" data-nimto-type="custom_name">you</strong>.</p></section><div class="nimto-template-extras"><div class="nimto-countdown-slot" data-nimto-countdown-slot="countdown_main" data-nimto-label="Countdown"></div><div class="nimto-rsvp-slot" data-nimto-rsvp-slot="rsvp_main" data-nimto-label="RSVP"></div><div class="nimto-music-slot" data-nimto-music-slot="music_main" data-nimto-label="Music"></div><div class="nimto-additional-info-slot" data-nimto-additional-info-slot="additional_info_main" data-nimto-label="Additional Information"></div><span class="nimto-style-marker" data-nimto-style-slot="primary_color" data-nimto-style-type="color" data-nimto-label="Primary Color" data-nimto-default="#17251d"></span><span class="nimto-style-marker" data-nimto-style-slot="secondary_color" data-nimto-style-type="color" data-nimto-label="Secondary Color" data-nimto-default="#6b5a4b"></span><span class="nimto-style-marker" data-nimto-style-slot="accent_color" data-nimto-style-type="color" data-nimto-label="Accent Color" data-nimto-default="#b78431"></span><span class="nimto-style-marker" data-nimto-style-slot="heading_font" data-nimto-style-type="font" data-nimto-label="Heading Font" data-nimto-default="Georgia, serif"></span><span class="nimto-style-marker" data-nimto-style-slot="body_font" data-nimto-style-type="font" data-nimto-label="Body Font" data-nimto-default="Arial, sans-serif"></span></div></main></body></html>
