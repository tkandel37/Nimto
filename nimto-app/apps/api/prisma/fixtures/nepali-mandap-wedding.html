<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nepali Mandap Wedding</title><style>*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:#5a1117;color:#fff8e8}.page{min-height:100vh;display:grid;place-items:center;padding:34px;background:radial-gradient(circle at top,#f7c56b44,transparent 34%),linear-gradient(135deg,#5a1117,#8b1f2a)}.card{width:min(820px,100%);position:relative;overflow:hidden;border:1px solid #f4c05e99;border-radius:34px;background:linear-gradient(180deg,#fff8e8,#ffe8bf);color:#4a1716;text-align:center;padding:72px 42px;box-shadow:0 30px 90px #21050866}.arch{position:absolute;inset:18px;border:2px solid #c9973d66;border-radius:220px 220px 28px 28px;pointer-events:none}.top{font:900 12px Arial;letter-spacing:.32em;text-transform:uppercase;color:#9f212a}.names{margin:34px 0 12px;font-size:clamp(48px,9vw,92px);line-height:.9;letter-spacing:-.05em}.amp{display:block;color:#c9973d;font-style:italic;font-size:.62em}.msg{max-width:590px;margin:28px auto;line-height:1.8;color:#78504b}.date{font:900 22px Arial;color:#9f212a}.venue{margin-top:20px;font:800 14px Arial;letter-spacing:.08em}.guest{margin-top:36px;color:#78504b}@media(max-width:620px){.page{padding:18px}.card{padding:56px 22px}.arch{inset:10px}}.nimto-template-extras{display:grid;gap:14px;justify-items:center;width:min(100%,560px);margin:30px auto 0}.nimto-countdown-slot,.nimto-rsvp-slot,.nimto-music-slot,.nimto-additional-info-slot{width:100%;text-align:center}.nimto-countdown-slot{font-weight:900}.nimto-rsvp-button{display:inline-flex;align-items:center;justify-content:center;min-width:170px;border-radius:999px;background:currentColor;color:#fff;padding:12px 22px;text-decoration:none}.nimto-music-slot audio{width:min(100%,320px)}.nimto-additional-info-slot{font-size:14px;line-height:1.6}.nimto-style-marker{display:none}</style></head><body data-nimto-share-description-field="event_message
