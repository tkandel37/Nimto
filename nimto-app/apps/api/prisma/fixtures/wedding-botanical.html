<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Botanical Wedding</title><style>

 their families</div><h1><span data-nimto-field="bride_name" data-nimto-label="Bride Name" data-nimto-type="text" data-nimto-required="true">Anika</span> <span class="amp">&</span> <span data-nimto-field="groom_name" data-nimto-label="Groom Name" data-nimto-type="text" data-nimto-required="true">Rohan</span></h1><p class="message" data-nimto-field="event_message" data-nimto-label="Event Message" data-nimto-type="textarea" data-nimto-required="true">Invite you to share in the joy of their wedding celebration.</p><div class="date" data-nimto-field="event_date" data-nimto-label="Event Date" data-nimto-type="date" data-nimto-required="true">November 14, 2026</div><div class="venue"><span data-nimto-field="event_time" data-nimto-label="Event Time" data-nimto-type="text" data-nimto-required="true">4:00 PM</span> · <span data-nimto-field="venue_name" data-nimto-label="Venue Name" data-nimto-type="text" data-nimto-required="true">The Heritage Garden</span></div><div class="guest">Especially for <span data-nimto-field="invitee_name" data-nimto-label="Invitee Name" data-nimto-type="custom_name">our dear guest</span></div></section><div class="nimto-template-extras"><div class="nimto-countdown-slot" data-nimto-countdown-slot="countdown_main" data-nimto-label="Countdown"></div><div class="nimto-rsvp-slot" data-nimto-rsvp-slot="rsvp_main" data-nimto-label="RSVP"></div><div class="nimto-music-slot" data-nimto-music-slot="music_main" data-nimto-label="Music"></div><div class="nimto-additional-info-slot" data-nimto-additional-info-slot="additional_info_main" data-nimto-label="Additional Information"></div><span class="nimto-style-marker" data-nimto-style-slot="primary_color" data-nimto-style-type="color" data-nimto-label="Primary Color" data-nimto-default="#17251d"></span><span class="nimto-style-marker" data-nimto-style-slot="secondary_color" data-nimto-style-type="color" data-nimto-label="Secondary Color" data-nimto-default="#6b5a4b"></span><span class="nimto-style-marker" data-nimto-style-slot="accent_color" data-nimto-style-type="color" data-nimto-label="Accent Color" data-nimto-default="#b78431"></span><span class="nimto-style-marker" data-nimto-style-slot="heading_font" data-nimto-style-type="font" data-nimto-label="Heading Font" data-nimto-default="Georgia, serif"></span><span class="nimto-style-marker" data-nimto-style-slot="body_font" data-nimto-style-type="font" data-nimto-label="Body Font" data-nimto-default="Arial, sans-serif"></span></div></main></body></html>
