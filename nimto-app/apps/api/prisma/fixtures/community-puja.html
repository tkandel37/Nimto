<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community Puja</title><style>*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:#fff2dd;color:#351d13}.page{min-height:100vh;display:grid;place-items:center;padding:32px;background:radial-gradient(circle at 80% 12%,#f2a54155,transparent 18rem),linear-gradient(135deg,#fff8ec,#efd0a0)}.card{width:min(790px,100%);border-radius:34px;background:#fffaf2;border:1px solid #b8692444;padding:62px 42px;text-align:center;box-shadow:0 28px 80px #7c451f30}.flame{width:70px;height:90px;margin:0 auto 24px;border-radius:60% 60% 55% 55%;background:linear-gradient(#ffcc63,#e85d35);box-shadow:0 0 0 12px #f7c65b30}.label{font:900 12px Arial;letter-spacing:.3em;text-transform:uppercase;color:#a64b22}h1{margin:22px 0;font-size:clamp(46px,8vw,82px);line-height:.92;letter-spacing:-.05em;color:#7c2e1b}.msg{max-width:570px;margin:0 auto 30px;line-height:1.8;color:#75564b}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}.box{border-radius:18px;background:#fff0d0;padding:16px;font:900 14px Arial}.guest{margin-top:30px;color:#75564b}@media(max-width:640px){.card{padding:46px 22px}.details{grid-template-columns:1fr}}.nimto-template-extras{display:grid;gap:14px;justify-items:center;width:min(100%,560px);margin:30px auto 0}.nimto-countdown-slot,.nimto-rsvp-slot,.nimto-music-slot,.nimto-additional-info-slot{width:100%;text-align:center}.nimto-countdown-slot{font-weight:900}.nimto-rsvp-button{display:inline-flex;align-items:center;justify-content:center;min-width:170px;border-radius:999px;background:currentColor;color:#fff;padding:12px 22px;text-decoration:none}.nimto-music-slot audio{width:min(100%,320px)}.nimto-additional-info-slot{font-size:14px;line-height:1.6}.nimto-style-marker{display:none}</style></head><body data-nimto-share-description-field="event_message" data-nimto-share-title-field="puja_name" data-nimto-countdown-position="bottom"><main class="page" data-nimto-print-page="page_main"><section class="card"><div class="flame"></div><p class="label" data-nimto-field="event_label" data-nimto-label="Event Label" data-nimto-type="text">Blessings and togetherness</p><h1 data-nimto-field="puja_name" data-nimto-label="Puja Name" data-nimto-type="text" data-nimto-required="true">Satyanarayan Puja</h1><p class="msg" data-nimto-field="event_message" data-nimto-label="Event Message" data-nimto-type="textarea" data-nimto-required="true">Please join our family and community for puja, prasad, and shared blessings.</p><div class="details"><div class="box" data-nimto-field="event_date" data-nimto-label="Event Date" data-nimto-type="date" data-nimto-required="true">Shrawan 5, 2083</div><div class="box" data-nimto-field="event_time" data-nimto-label="Event Time" data-nimto-type="text" data-nimto-required="true">7:00 AM</div><div class="box" data-nimto-field="venue_name" data-nimto-label="Venue Name" data-nimto-type="text" data-nimto-required="true">Ganesh Mandir Hall</div><div class="box">Prasad after puja</div></div><p class="guest">Respectfully inviting <strong data-nimto-field="invitee_name" data-nimto-label="Invitee Name" data-nimto-type="custom_name">you</strong>.</p></section><div class="nimto-template-extras"><div class="nimto-countdown-slot" data-nimto-countdown-slot="countdown_main" data-nimto-label="Countdown"></div><div class="nimto-rsvp-slot" data-nimto-rsvp-slot="rsvp_main" data-nimto-label="RSVP"></div><div class="nimto-music-slot" data-nimto-music-slot="music_main" data-nimto-label="Music"></div><div class="nimto-additional-info-slot" data-nimto-additional-info-slot="additional_info_main" data-nimto-label="Additional Information"></div><span class="nimto-style-marker" data-nimto-style-slot="primary_color" data-nimto-style-type="color" data-nimto-label="Primary Color" data-nimto-default="#17251d"></span><span class="nimto-style-marker" data-nimto-style-slot="secondary_color" data-nimto-style-type="color" data-nimto-label="Secondary Color" data-nimto-default="#6b5a4b"></span><span class="nimto-style-marker" data-nimto-style-slot="accent_color" data-nimto-style-type="color" data-nimto-label="Accent Color" data-nimto-default="#b78431"></span><span class="nimto-style-marker" data-nimto-style-slot="heading_font" data-nimto-style-type="font" data-nimto-label="Heading Font" data-nimto-default="Georgia, serif"></span><span class="nimto-style-marker" data-nimto-style-slot="body_font" data-nimto-style-type="font" data-nimto-label="Body Font" data-nimto-default="Arial, sans-serif"></span></div></main></body></html>
