<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Community Puja</title><style>*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;background:#fff2dd;color:#351d13}.page{min-height:100vh;display:grid;place-items:center;padding:32px;background:radial-gradient(circle at 80% 12%,#f2a54155,transparent 18rem),linear-gradient(135deg,#fff8ec,#efd0a0)}.card{width:min(790px,100%);border-radius:34px;background:#fffaf2;border:1px solid #b8692444;padding:62px 42px;text-align:center;box-shadow:0 28px 80px #7c451f30}.flame{width:70px;height:90px;margin:0 auto 24px;border-radius:60% 60% 55% 55%;background:linear-gradient(#ffcc63,#e85d35);box-shadow:0 0 0 12px #f7c65b30}.label{font:900 12px Arial;letter-spacing:.3em;text-transform:uppercase;color:#a64b22}h1{margin:22px 0;font-size:clamp(46px,8vw,82px);line-height:.92;letter-spacing:-.05em;color:#7c2e1b}.msg{max-width:570px;margin:0 auto 30px;line-height:1.8;color:#75564b}.details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}.box{border-radius:18px;background:#fff0d0;padding:16px;font:900 14px Arial}.guest{margin-top:30px;color:#75564b}@media(max-width:640px){.card{padding:46px 22px}.details{grid-template-columns:1fr}}</style></head><body><main class="page"><section class="card"><div class="flame"></div><p class="label" data-nimto-field="event_label" data-nimto-label="Event Label" data-nimto-type="text">Blessings and togetherness</p><h1 data-nimto-field="puja_name" data-nimto-label="Puja Name" data-nimto-type="text" data-nimto-required="true">Satyanarayan Puja</h1><p class="msg" data-nimto-field="event_message" data-nimto-label="Event Message" data-nimto-type="textarea" data-nimto-required="true">Please join our family and community for puja, prasad, and shared blessings.</p><div class="details"><div class="box" data-nimto-field="event_date" data-nimto-label="Event Date" data-nimto-type="date" data-nimto-required="true">Shrawan 5, 2083</div><div class="box" data-nimto-field="event_time" data-nimto-label="Event Time" data-nimto-type="text" data-nimto-required="true">7:00 AM</div><div class="box" data-nimto-field="venue_name" data-nimto-label="Venue Name" data-nimto-type="text" data-nimto-required="true">Ganesh Mandir Hall</div><div class="box">Prasad after puja</div></div><p class="guest">Respectfully inviting <strong data-nimto-field="invitee_name" data-nimto-label="Invitee Name" data-nimto-type="custom_name">you</strong>.</p></section></main></body></html>
