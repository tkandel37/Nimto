<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pasni Rice Feeding</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff4f6;color:#40202b}.page{min-height:100vh;display:grid;place-items:center;padding:30px;background:radial-gradient(circle at top,#ffd8e5,transparent 22rem),linear-gradient(145deg,#fff8f2,#f7d7dc)}.card{width:min(760px,100%);position:relative;overflow:hidden;background:white;border-radius:38px;padding:60px 42px;text-align:center;box-shadow:0 28px 85px #9b6b7733}.card:before{content:"";position:absolute;inset:auto -40px -80px;height:180px;background:#f7c9d7;border-radius:50% 50% 0 0}.content{position:relative}.label{text-transform:uppercase;letter-spacing:.28em;color:#be496d;font-size:12px;font-weight:900}.baby{margin:20px auto 8px;width:92px;height:92px;border-radius:32px;background:#ffe5b4;display:grid;place-items:center;font-size:46px}h1{margin:20px 0;font-size:clamp(44px,8vw,80px);letter-spacing:-.06em;line-height:.9}.msg{max-width:560px;margin:24px auto;line-height:1.8;color:#7b5962}.details{display:grid;gap:12px;max-width:520px;margin:26px auto 0}.pill{border-radius:18px;background:#fff1f5;padding:15px;font-weight:900}.guest{margin-top:28px;color:#7b5962}@media(max-width:620px){.card{padding:46px 22px}}.nimto-template-extras{display:grid;gap:14px;justify-items:center;width:min(100%,560px);margin:30px auto 0}.nimto-countdown-slot,.nimto-rsvp-slot,.nimto-music-slot,.nimto-additional-info-slot{width:100%;text-align:center}.nimto-countdown-slot{font-weight:900}.nimto-rsvp-button{display:inline-flex;align-items:center;justify-content:center;min-width:170px;border-radius:999px;background:currentColor;color:#fff;padding:12px 22px;text-decoration:none}.nimto-music-slot audio{width:min(100%,320px)}.nimto-additional-info-slot{font-size:14px;line-height:1.6}.nimto-style-marker{display:none}</style></head><body data-nimto-share-description-field="event_message" data-nimto-share-title-field="baby_name" data-nimto-countdown-position="bottom"><main class="page" data-nimto-print-page="page_main"><section class="card"><div class="content"><p class="label" data-nimto-field="event_label" data-nimto-label="Event Label" data-nimto-type="text">Pasni celebration</p><div class="baby">🍚</div><h1 data-nimto-field="baby_name" data-nimto-label="Baby Name" data-nimto-type="text" data-nimto-required="true">Maya</h1><p class="msg" data-nimto-field="event_message" data-nimto-label="Event Message" data-nimto-type="textarea" data-nimto-required="true">Our little one is ready for their first rice feeding. Please join us for blessings, smiles, and family love.</p><div class="details"><div class="pill" data-nimto-field="event_date" data-nimto-label="Event Date" data-nimto-type="date" data-nimto-required="true">March 8, 2027</div><div class="pill"><span data-nimto-field="event_time" data-nimto-label="Event Time" data-nimto-type="text" data-nimto-required="true">11:00 AM</span> · <span data-nimto-field="venue_name" data-nimto-label="Venue Name" data-nimto-type="text" data-nimto-required="true">Annapurna Banquet</span></div></div><p class="guest">Lovingly inviting <strong data-nimto-field="invitee_name" data-nimto-label="Invitee Name" data-nimto-type="custom_name">you</strong>.</p></div></section><div class="nimto-template-extras"><div class="nimto-countdown-slot" data-nimto-countdown-slot="countdown_main" data-nimto-label="Countdown"></div><div class="nimto-rsvp-slot" data-nimto-rsvp-slot="rsvp_main" data-nimto-label="RSVP"></div><div class="nimto-music-slot" data-nimto-music-slot="music_main" data-nimto-label="Music"></div><div class="nimto-additional-info-slot" data-nimto-additional-info-slot="additional_info_main" data-nimto-label="Additional Information"></div><span class="nimto-style-marker" data-nimto-style-slot="primary_color" data-nimto-style-type="color" data-nimto-label="Primary Color" data-nimto-default="#17251d"></span><span class="nimto-style-marker" data-nimto-style-slot="secondary_color" data-nimto-style-type="color" data-nimto-label="Secondary Color" data-nimto-default="#6b5a4b"></span><span class="nimto-style-marker" data-nimto-style-slot="accent_color" data-nimto-style-type="color" data-nimto-label="Accent Color" data-nimto-default="#b78431"></span><span class="nimto-style-marker" data-nimto-style-slot="heading_font" data-nimto-style-type="font" data-nimto-label="Heading Font" data-nimto-default="Georgia, serif"></span><span class="nimto-style-marker" data-nimto-style-slot="body_font" data-nimto-style-type="font" data-nimto-label="Body Font" data-nimto-default="Arial, sans-serif"></span></div></main></body></html>
