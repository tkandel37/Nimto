<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tihar Deusi Bhailo</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#11102a;color:white}.page{min-height:100vh;display:grid;place-items:center;padding:30px;background:radial-gradient(circle at 12% 18%,#ffd16655,transparent 18rem),radial-gradient(circle at 88% 12%,#f7258555,transparent 15rem),linear-gradient(145deg,#11102a,#30123b)}.card{width:min(830px,100%);border-radius:34px;background:#ffffff12;border:1px solid #ffffff22;backdrop-filter:blur(10px);padding:58px;text-align:center;box-shadow:0 30px 90px #0006}.diya{font-size:54px;letter-spacing:.4em;text-indent:.4em}.label{text-transform:uppercase;letter-spacing:.3em;color:#ffd166;font-size:12px;font-weight:900}h1{margin:26px 0;font-size:clamp(48px,9vw,88px);line-height:.9;letter-spacing:-.06em}.msg{max-width:600px;margin:0 auto 30px;color:#e5dff1;line-height:1.8}.info{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.pill{border:1px solid #ffffff22;border-radius:999px;background:#ffffff14;padding:14px 18px;font-weight:900}.guest{margin-top:32px;color:#ffd166}@media(max-width:620px){.card{padding:44px 20px}.diya{letter-spacing:.16em;text-indent:.16em}}</style></head><body><main class="page"><section class="card"><div class="diya">🪔 🪔 🪔</div><p class="label" data-nimto-field="event_label" data-nimto-label="Event Label" data-nimto-type="text">Festival of lights</p><h1 data-nimto-field="event_title" data-nimto-label="Event Title" data-nimto-type="text" data-nimto-required="true">Deusi Bhailo Night</h1><p class="msg" data-nimto-field="event_message" data-nimto-label="Event Message" data-nimto-type="textarea" data-nimto-required="true">Join us for lights, music, sweets, laughter, and a joyful Tihar evening with friends and family.</p><div class="info"><span class="pill" data-nimto-field="event_date" data-nimto-label="Event Date" data-nimto-type="date" data-nimto-required="true">November 9, 2026</span><span class="pill" data-nimto-field="event_time" data-nimto-label="Event Time" data-nimto-type="text" data-nimto-required="true">6:30 PM</span><span class="pill" data-nimto-field="venue_name" data-nimto-label="Venue Name" data-nimto-type="text" data-nimto-required="true">Bhaktapur Courtyard</span></div><p class="guest">Bring your smile, <strong data-nimto-field="invitee_name" data-nimto-label="Invitee Name" data-nimto-type="custom_name">dear guest</strong>.</p></section></main></body></html>
